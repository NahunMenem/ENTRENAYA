name: entrenaya_mobile
description: "EntrenaYa fitness and training app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.6.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/entrenaya_logo.png
    - assets/images/welcome_gym.png
